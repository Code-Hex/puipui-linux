name: Build and test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable vsock transport
        run: |
          sudo modprobe vhost_vsock
          sudo chmod a+rw /dev/vhost-vsock
      - name: Build test environment
        run: docker build -t puipui-tests -f tests/Dockerfile .
      - name: Build and test both images
        run: |
          docker run --rm --device /dev/vhost-vsock --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --user "$(id -u):$(id -g)" \
            -v /etc/passwd:/etc/passwd:ro -v "$PWD:/workspace" puipui-tests
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-logs
          path: build-tests/
      - name: Upload tested images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: puipui-images
          path: puipui_linux_*.tar.gz
